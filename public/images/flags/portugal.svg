<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="100%" height="100%">
  <!-- Green vertical bar (2/5 = 480) -->
  <rect width="480" height="800" fill="#006600"/>
  <!-- Red vertical bar (3/5 = 720) -->
  <rect x="480" width="720" height="800" fill="#FF0000"/>
  <!-- Armillary Sphere & Portuguese Coat of Arms Center -->
  <g transform="translate(480, 400)">
    <!-- Yellow Armillary Sphere -->
    <circle r="200" fill="#FFD700" stroke="#000000" stroke-width="4"/>
    <circle r="170" fill="none" stroke="#8B6914" stroke-width="12"/>
    <circle r="140" fill="none" stroke="#FFD700" stroke-width="8"/>
    <path d="M-170,0 H170 M0,-170 V170 M-120,-120 L120,120 M-120,120 L120,-120" stroke="#8B6914" stroke-width="10"/>
    <!-- Red Shield -->
    <path d="M-90,-110 H90 V20 C90,80 0,130 0,130 C0,130 -90,80 -90,20 Z" fill="#FF0000" stroke="#FFFFFF" stroke-width="10"/>
    <!-- White Inner Shield -->
    <path d="M-60,-80 H60 V10 C60,50 0,90 0,90 C0,90 -60,50 -60,10 Z" fill="#FFFFFF"/>
    <!-- 5 Blue Quinas (Cross pattern) -->
    <path d="M-30,-50 H-10 V-20 C-10,-5 -20,5 -20,5 C-20,5 -30,-5 -30,-20 Z" fill="#002B7F"/>
    <path d="M10,-50 H30 V-20 C30,-5 20,5 20,5 C20,5 10,-5 10,-20 Z" fill="#002B7F"/>
    <path d="M-10,-30 H10 V0 C10,15 0,25 0,25 C0,25 -10,15 -10,0 Z" fill="#002B7F"/>
    <path d="M-30,-10 H-10 V20 C-10,35 -20,45 -20,45 C-20,45 -30,35 -30,20 Z" fill="#002B7F"/>
    <path d="M10,-10 H30 V20 C30,35 20,45 20,45 C20,45 10,35 10,20 Z" fill="#002B7F"/>
    <!-- 7 Yellow Castles around border -->
    <rect x="-80" y="-105" width="20" height="20" fill="#FFD700"/>
    <rect x="-10" y="-105" width="20" height="20" fill="#FFD700"/>
    <rect x="60" y="-105" width="20" height="20" fill="#FFD700"/>
    <rect x="-85" y="-30" width="20" height="20" fill="#FFD700"/>
    <rect x="65" y="-30" width="20" height="20" fill="#FFD700"/>
    <rect x="-65" y="40" width="20" height="20" fill="#FFD700"/>
    <rect x="45" y="40" width="20" height="20" fill="#FFD700"/>
  </g>
</svg>
