<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 600" width="100%" height="100%">
  <!-- Blue background -->
  <rect width="1200" height="600" fill="#00247D"/>
  
  <!-- Union Jack in Canton -->
  <g id="canton">
    <clipPath id="canton-clip">
      <rect width="600" height="300"/>
    </clipPath>
    <g clip-path="url(#canton-clip)">
      <path d="M0,0 L600,300 M600,0 L0,300" stroke="#FFFFFF" stroke-width="60"/>
      <path d="M0,0 L600,300 M600,0 L0,300" stroke="#CC0000" stroke-width="40"/>
      <path d="M300,0 V300 M0,150 H600" stroke="#FFFFFF" stroke-width="100"/>
      <path d="M300,0 V300 M0,150 H600" stroke="#CC0000" stroke-width="60"/>
    </g>
  </g>

  <!-- Southern Cross Stars (Red with White Border) -->
  <g id="stars" fill="#CC0000" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round">
    <!-- Gamma Crucis (top) -->
    <polygon points="900,90 912,125 948,125 918,147 930,182 900,160 870,182 882,147 852,125 888,125"/>
    <!-- Beta Crucis (left) -->
    <polygon points="780,240 790,270 820,270 795,288 805,318 780,300 755,318 765,288 740,270 770,270"/>
    <!-- Delta Crucis (right) -->
    <polygon points="1020,200 1029,228 1058,228 1034,245 1043,273 1020,256 997,273 1006,245 982,228 1011,228"/>
    <!-- Alpha Crucis (bottom) -->
    <polygon points="900,420 914,460 956,460 922,485 936,525 900,500 864,525 878,485 844,460 886,460"/>
  </g>
</svg>
